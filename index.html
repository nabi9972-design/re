<script>
'use strict';
const KEY='seohae-gratitude-v2';
let raw={};try{raw=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
const S={unlocked:raw.unlocked===true,stage:Number.isInteger(raw.stage)?Math.max(0,Math.min(4,raw.stage)):0,seen:raw.seen&&typeof raw.seen==='object'?raw.seen:{},calls:raw.calls&&typeof raw.calls==='object'?raw.calls:{},likes:raw.likes&&typeof raw.likes==='object'?raw.likes:{},postLike:raw.postLike===true,sound:raw.sound===true};
let page='',pin='',err='',storyIndex=0,callType='',callMode='',returnTo='home',toastTimer=null,audioCtx=null;const V=document.getElementById('view'),D=document.getElementById('device'),T=document.getElementById('toast');
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tone(call=false){if(!S.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();[0,.2, ...(call?[.6,.8]:[])].forEach((at,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=i%2?880:660;g.gain.setValueAtTime(.035,audioCtx.currentTime+at);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+at+.15);o.start(audioCtx.currentTime+at);o.stop(audioCtx.currentTime+at+.16)})}catch(e){}}
function show(html,wall=false){D.classList.toggle('wall',wall);V.innerHTML=html;V.scrollTop=0}
function head(title,back='home'){return `<div class="header"><button onclick="navigate('${back}')">‹ 뒤로</button><b>${title}</b><small>서해고 1학년</small></div>`}
function hideToast(){clearTimeout(toastTimer);T.hidden=true}
function notify(app,text,target,call=false){hideToast();T.className='toast'+(call?' callbanner':'');T.innerHTML=`<button class="close" aria-label="알림 닫기" onclick="hideToast()">×</button><button class="open" onclick="hideToast();navigate('${target}')"><small>${app} · 지금</small>${text}</button>`;T.hidden=false;tone(call);toastTimer=setTimeout(hideToast,10000)}
function mark(id){S.seen[id]=true;save()}
function home(){if(S.unlocked)navigate('home')}
function lock(){page='lock';show(`<div class="lock"><div class="date">11월 11일 수요일</div><div class="clock">08:40</div><div style="margin-top:9px;font-size:12px;opacity:.8">서해고등학교 · 1학년의 하루</div><button class="notification glass" onclick="pinScreen()"><small>💬 카카오톡 · 하린</small><b>야 오늘 친구사랑주간이잖아 ㅋㅋ</b><br>폰 비번도 오늘 날짜로 해놨다며?</button><button class="unlock" onclick="pinScreen()">⌃<br><br>눌러서 잠금 해제</button><p style="font-size:10px;opacity:.65;line-height:1.8">등장인물과 계정은 모두 가상입니다.<br>실제 전화·SNS와 연결되지 않는 행사 게임입니다.</p></div>`,true)}
function pinScreen(){page='pin';show(`<div class="pin"><p>암호 입력</p><div class="dots">${[0,1,2,3].map(i=>`<i class="${pin.length>i?'filled':''}"></i>`).join('')}</div><div class="pinmsg" role="status">${esc(err||'오늘의 날짜 네 자리')}</div><div class="keypad">${[1,2,3,4,5,6,7,8,9].map((n,i)=>`<button onclick="digit('${n}')">${n}<small>${['','ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ'][i]||'·'}</small></button>`).join('')}<button class="plain" onclick="lock()">취소</button><button onclick="digit('0')">0</button><button class="plain" onclick="pin=pin.slice(0,-1);pinScreen()">지우기</button></div></div>`,true)}
function digit(n){if(pin.length>=4)return;pin+=n;if(pin.length===4){if(pin==='1111'){S.unlocked=true;save();navigate('home');notify('Instagram · dear_seohae','새로운 메시지가 도착했어요.','anon');return}pin='';err='힌트: 11월 11일을 네 자리로 입력해 봐!'}pinScreen()}
function icon(label,art,cls,to){return `<button class="app" onclick="navigate('${to}')"><span class="icon ${cls}">${art}</span>${label}</button>`}
function navigate(to){if(!S.unlocked){lock();return}err='';page=to;switch(to){case'home':renderHome();break;case'kakao':kakao();break;case'instagram':instagram();break;case'photos':photos();break;case'notes':notes();break;case'phone':phone();break;case'gift':gift();break;case'settings':settings();break;case'anon':anon();break;case'group':group();break;case'harin':harin();break;case'doyun':doyun();break;case'seoyun':seoyun();break;case'dms':dms();break;case'incoming-harin':incoming('harin');break;case'incoming-seoyun':if(S.stage>=3)incoming('seoyun');else phone();break;default:renderHome()}}
function renderHome(){show(`<div class="home"><div class="widget glass"><small>WED · NOVEMBER 11</small><h2>오늘, 우리 사이</h2><p>서해고등학교 1학년<br>작은 친절이 돌아오는 하루</p></div><div class="apps">${icon('카카오톡','TALK','yellow','kakao')}${icon('Instagram','◎','insta','instagram')}${icon('사진','🌸','white','photos')}${icon('메모','≡','noteIcon','notes')}${icon('선물','🎁','white','gift')}${icon('설정','⚙','white','settings')}</div><p class="guide">${['인스타 DM에 새로운 연락이 와 있어요.','하린에게 전화가 왔어요. 전화 앱을 확인해 보세요.','친구들의 스토리에 힌트가 있어요.','서윤에게 마지막 전화가 왔어요.','오늘의 이야기를 모두 찾았어요. 선물을 확인하세요.'][S.stage]}</p><div class="dock glass">${icon('전화','☎','green','phone')}${icon('메시지','☏','green','kakao')}${icon('Instagram','◎','insta','instagram')}</div></div>`,true)}
function row(name,preview,art,to,badge=''){return `<button class="row" onclick="navigate('${to}')"><span class="avatar">${art}</span><div><b>${name}</b><p>${preview}</p></div>${badge?`<span class="badge">${badge}</span>`:''}</button>`}
function kakao(){show(head('채팅')+row('하린',S.stage>=1?'전화했는데! 통화 기록 확인해 봐 ㅋㅋ':'야 오늘 친구사랑주간이잖아 ㅋㅋ','🐱','harin',S.stage>=1&&!S.calls.harin?'1':'')+row('1학년 우리끼리','도윤: 비 진짜 많이 오네','🏫','group')+row('도윤','필기 빌려줘서 고마워!','🐻','doyun')+row('서윤',S.stage>=3?'나였어. 맞혀줘서 고마워 ☔':'지난주 수요일, 잘 들어갔어?','🐰','seoyun',S.stage>=3?'1':''))}
function message(name,text,mine=false){return `<div class="msg ${mine?'mine':''}">${mine?'':`<span class="avatar">${name==='하린'?'🐱':name==='도윤'?'🐻':name==='서윤'?'🐰':'✉'}</span>`}<div>${mine?'':`<div class="name">${esc(name)}</div>`}<div class="bubble">${esc(text)}</div></div></div>`}
function chatShell(title,body,dm=false,back='kakao'){show(`<div class="chat ${dm?'dmchat':''}">${head(title,back)}<div class="thread"><div class="day">11월 11일 수요일</div>${body}</div></div>`)}
function group(){mark('group');chatShell('1학년 우리끼리',`<div class="day">지난주 · 11월 4일 수요일</div>`+message('도윤','와 비 진짜 많이 오네. 난 엄마 차 타고 감')+message('하린','난 우산 챙겼지롱 ㅋㅋ 근데 서윤이 우산 없대')+message('서윤','편의점에서 하나 사면 되지 뭐 ㅠ')+message('나','나 우산 있어. 정문 앞에서 만나 같이 가자',true)+message('서윤','진짜? 고마워. 바로 내려갈게!'))}
function doyun(){chatShell('도윤',message('도윤','어제 수학 필기 빌려줘서 고마워! 덕분에 살았다')+message('나','다음엔 네가 알려줘 ㅋㅋ',true)+message('도윤','콜 ㅋㅋ 근데 지난주 수요일 비 진짜 많이 왔잖아. 난 엄마 차 타고 갔는데 넌 안 젖었냐?'))}
function harin(){let body=message('하린','야 인스타에 누가 너 찾는 것 같던데? ㅋㅋ')+message('나','나도 지금 누군지 찾는 중',true);if(S.stage>=1){body+=message('하린','그날 내가 본 게 있어서 전화했어. 받아 봐!')+`<button class="primary" onclick="incoming('harin')">☎ ${S.calls.harin?'통화 내용 다시 확인':'하린 전화 받기'}</button>`}chatShell('하린',body)}
function seoyun(){let body=message('서윤','지난주 수요일, 잘 들어갔어?')+message('나','응 ㅋㅋ 가방만 좀 젖음. 너는?',true)+message('서윤','나도 잘 들어왔어. 우산 고마워!');if(S.stage>=3){body+=`<div class="day">오늘</div>`+message('서윤','나였어 ㅋㅋ DM 보낸 사람. 맞혀줘서 고마워 ☔')+message('서윤','그날 같이 가자고 먼저 말해줘서 좋았어. 오늘은 내가 챙길게!')+`<button class="primary" onclick="incoming('seoyun')">☎ 서윤과 통화하기</button>`}chatShell('서윤',body)}
function photos(){mark('photos');show(head('사진')+`<div class="pad"><h2>보관함</h2><p class="muted">2장의 사진 · 사진을 눌러 기록 확인</p><div class="grid"><button class="photo" onclick="photoDetail(0)"><span>☂</span><b>비 오는 하굣길</b><small>11월 4일 · 16:32</small></button><button class="photo" style="background:#eee4d0" onclick="photoDetail(1)"><span>📓</span><b>수학 필기</b><small>11월 10일 · 17:10</small></button></div></div>`)}
function photoDetail(i){if(i===0){mark('umbrella');show(head('11월 4일 · 수요일','photos')+`<div class="pad"><div class="photo" style="min-height:350px"><span>☂</span><h2>둘이 쓰기엔 조금 작은 우산</h2><small>젖은 가방 끈과 우산 두 사람 몫의 발자국</small></div><p class="muted">11월 4일 오후 4:32<br>정문 앞에서 찍은 사진.<br>사진 메모: ‘가방은 좀 젖었지만 같이 가니까 덜 심심함 ㅋㅋ’</p></div>`)}else{show(head('11월 10일 · 화요일','photos')+`<div class="pad"><div class="photo" style="background:#eee4d0;min-height:300px"><span>📓</span><h2>수학 필기</h2><p>도윤이에게 보내준 수업 필기</p></div><p class="muted">11월 10일 오후 5:10<br>작은 메모: ‘고맙다고 다음에 설명해준대 ㅋㅋ’</p></div>`)}}
function notes(){show(head('메모')+`<div class="pad notes"><small class="muted">나의 작은 기록</small><h2>11월의 기억 조각</h2><p>11/4 수요일 ☔<br>우산 챙겨서 다행.<br>정문 앞에서 같이 출발했음.<br>가방은 조금 젖었지만 괜찮았다.</p><p>11/10 화요일 📓<br>도윤이에게 수학 필기 보내주기 ✓</p><p>11/11 수요일 🎁<br>친구사랑주간 행사.<br>고마운 말은 생각났을 때 전하기!</p><p class="muted">막히면: 사진의 날짜와 단톡방의 날짜를 연결해 보세요. 전화는 최근 통화에서 다시 확인할 수 있어요.</p></div>`)}
function dms(){show(head('메시지','instagram')+row('dear_seohae',S.stage>=3?'맞아, 나야 ☔':'너는 기억 못 할 수도 있는데…','✉','anon','1')+row('하린','누군지 알아내면 알려줘 ㅋㅋ','🐱','harin'))}
function anon(){let body=message('dear_seohae','너는 기억 못 할 수도 있는데, 난 그날 진짜 고마웠어.\n오늘은 내가 돌려줄 차례!\n점심시간 전에 내가 누군지 맞혀봐.')+message('dear_seohae','첫 번째 힌트 ☔\n비 오는 날, 네 가방은 좀 젖었지?');if(S.stage===0){body+=`<div class="choices"><p>사진첩과 단톡방에서 그날의 기록을 찾아 답장해 보세요.</p>${option('우산을 같이 쓰고 하교했던 날?',"first('umbrella')")}${option('수학 필기를 보내줬던 날?',"first('notes')")}${option('급식 메뉴를 알려줬던 날?',"first('lunch')")}<div class="feedback" role="status">${esc(err)}</div><button class="choice" onclick="home()">⌂ 홈으로 가서 기록 찾기</button></div>`}else{body+=message('나','우산을 같이 쓰고 하교했던 날?',true)+message('dear_seohae','맞아! 두 번째 힌트는 친구들 스토리에 있어.\n혹시 누군지 알아냈어?');if(S.stage===1){body+=`<div class="choices"><p>하린에게 전화가 왔어요. 전화 앱에서 받거나 최근 통화를 확인해 보세요.</p><button class="primary" onclick="incoming('harin')">☎ 하린 전화 확인</button></div>`}else if(S.stage===2){body+=`<div class="choices"><p>친구들의 스토리를 확인한 뒤, 마음에 걸리는 친구의 스토리에 답장해 보세요.</p><button class="primary" onclick="navigate('instagram')">스토리 보러 가기</button></div>`}else{body+=message('나','혹시 서윤이야?',true)+message('dear_seohae','맞아, 나 서윤이야 ㅋㅋ\n그날 먼저 같이 가자고 해줘서 고마웠어.');body+=`<button class="primary" onclick="navigate('seoyun')">카카오톡에서 이어서 대화하기</button>`}}chatShell('dear_seohae',body,true,'dms')}
function option(text,fn){return `<button class="choice" onclick="${fn}">${text}</button>`}
function first(answer){if(S.stage!==0)return;if(answer!=='umbrella'){err='가방이 젖었던 날이야. 사진의 날짜와 단톡방을 연결해 봐!';anon();return}if(!S.seen.umbrella||!S.seen.group){err='사진첩의 우산 사진과 ‘1학년 우리끼리’ 대화방을 먼저 확인해 봐!';anon();return}S.stage=1;save();err='';anon();notify('☎ 하린','전화가 왔어요. 눌러서 받기','incoming-harin',true)}
const STORIES=[{name:'하린',id:'harin_day',art:'🍜',text:'비 오는 날엔 역시 따뜻한 거 ☔\n그날은 혼자 우산 쓰고\n먼저 집으로 튀었음 ㅋㅋ',color:'#af7858'},{name:'도윤',id:'doyun_math',art:'📓',text:'어제 필기 빌려준 친구야\n덕분에 살았다…\n다음엔 내가 설명해줌',color:'#677d5e'},{name:'서윤',id:'seoyun_rain',art:'☂',text:'지난주 수요일,\n“같이 가자” 한마디가\n생각보다 오래 남는 날 ☔',color:'#586d8c'}];
function instagram(){show(`<div class="ighead"><b>Instagram</b><button aria-label="DM 열기" onclick="navigate('dms')">✉</button></div><div class="stories">${STORIES.map((s,i)=>`<button class="storybtn" onclick="story(${i})"><span class="ring ${S.seen['story'+i]?'seen':''}">${s.art}</span>${s.name}</button>`).join('')}</div><div class="post"><div class="postheader"><b>seohae_1st</b> · 서해고등학교</div><div class="postart">☘</div><button aria-label="게시물 좋아요" onclick="S.postLike=!S.postLike;save();instagram()">${S.postLike?'♥':'♡'}</button><p><b>좋아요 ${S.postLike?112:111}개</b><br><b>seohae_1st</b> 11월 11일, 친구사랑주간.<br>별거 아니라고 생각했던 친절이<br>누군가에겐 오래 남을 수도 있어요.</p></div><div class="pad"><button class="choice" onclick="navigate('dms')">✉ 받은 DM 확인하기</button><button class="choice" onclick="home()">⌂ 홈으로 돌아가기</button></div>`)}
function story(i){storyIndex=i;page='story';const s=STORIES[i];mark('story'+i);show(`<div class="story"><div class="progress">${STORIES.map((x,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}</div><div class="storytop"><b>${s.name} · ${s.id}</b><button aria-label="스토리 닫기" onclick="navigate('instagram')">×</button></div><div class="storyart" style="background:linear-gradient(145deg,${s.color},#242b3c)"><span>${s.art}</span><p>${s.text}</p><small>11월 11일 · 나의 기억</small></div><div class="storynav"><button ${i===0?'disabled':''} onclick="story(${i-1})">‹ 이전</button><button ${i===2?'disabled':''} onclick="story(${i+1})">다음 ›</button></div><div class="storyactions"><button class="reply" onclick="replyStory()">이 스토리에 답장 보내기…</button><button aria-label="스토리 좋아요" onclick="S.likes[${i}]=!S.likes[${i}];save();story(${i})">${S.likes[i]?'♥':'♡'}</button></div></div>`)}
function replyStory(){page='storyReply';const s=STORIES[storyIndex];chatShell(s.name+' · 스토리 답장',message(s.name,s.text)+`<div class="choices"><p>이 스토리의 주인공이 익명 DM을 보냈을까?</p>${option('혹시 나한테 익명 DM 보냈어?','identify()')}${option('스토리 잘 봤어 ㅋㅋ','casualReply()')}<div class="feedback" role="status">${esc(err)}</div><button class="choice" onclick="story(storyIndex)">스토리로 돌아가기</button></div>`,true,'instagram')}
function casualReply(){err='답장을 보냈어요. '+STORIES[storyIndex].name+': ㅋㅋ 봐줘서 고마워!';replyStory()}
function identify(){if(S.stage<2){err='아직 첫 번째 단서를 확인하는 중이야. 익명 DM과 하린의 전화를 먼저 확인해 봐!';replyStory();return}if(storyIndex!==2){err=storyIndex===0?'하린: 나 아님 ㅋㅋ 난 그날 내 우산으로 먼저 갔잖아!':'도윤: 난 필기 고마웠던 거야 ㅋㅋ 비 온 날은 엄마 차 타고 갔어.';replyStory();return}if(S.stage>=3){navigate('seoyun');return}if(!S.seen.story0||!S.seen.story1||!S.seen.story2){err='다른 두 친구의 스토리도 보고 비교해 보자!';replyStory();return}S.stage=3;save();navigate('seoyun');notify('카카오톡 · 서윤','나였어 ㅋㅋ 맞혀줘서 고마워 ☔','seoyun');}
function phone(){show(head('전화')+`<div class="pad"><h2>최근 통화</h2><p class="muted">놓친 전화도 눌러서 다시 확인할 수 있어요.</p></div>`+(S.stage>=3?row('서윤',S.calls.seoyun?'통화 내용 다시 보기':'수신 전화 · 눌러서 확인','🐰','incoming-seoyun',S.calls.seoyun?'':'1'):'')+(S.stage>=1?row('하린',S.calls.harin?'통화 내용 다시 보기':'수신 전화 · 눌러서 확인','🐱','incoming-harin',S.calls.harin?'':'1'):'<div class="pad muted">아직 통화 기록이 없어요. 인스타 DM을 확인해 보세요.</div>'))}
function incoming(type){if(type==='harin'&&S.stage<1){navigate('phone');return}if(type==='seoyun'&&S.stage<3){navigate('phone');return}hideToast();callType=type;callMode='incoming';returnTo=page;page='incoming';let name=type==='harin'?'하린':'서윤';show(`<div class="callpage"><small>수신 전화 · 서해고 1학년</small><div class="caller">${type==='harin'?'🐱':'🐰'}</div><h1>${name}</h1><small>휴대전화</small><p class="muted" style="color:#b7c3d5;margin-top:35px">게임 속 가상 통화입니다.<br>받으면 통화 내용이 자막으로 나옵니다.</p><div class="callbottom"><div><button class="round red" aria-label="전화 거절" onclick="declineCall()">✕</button><div class="calllabel">거절</div></div><div><button class="round accept" aria-label="전화 받기" onclick="acceptCall()">☎</button><div class="calllabel">응답</div></div></div></div>`);tone(true)}
function declineCall(){S.calls[callType+'missed']=true;save();navigate('phone');notify('전화','부재중 전화는 최근 통화에서 다시 받을 수 있어요.','phone')}
function acceptCall(){callMode='active';page='activeCall';const isH=callType==='harin';show(`<div class="callpage"><small>통화 연결됨 · 자막 모드</small><div class="caller">${isH?'🐱':'🐰'}</div><h1>${isH?'하린':'서윤'}</h1><small>서해고등학교 1학년</small><div class="transcript">${isH?'“야 ㅋㅋ 너 익명 DM 누군지 찾는다며?\n그날 너 정문에서 누구랑 우산 같이 쓰고 갔잖아.\n난 내 우산 쓰고 먼저 갔고, 도윤이는 엄마 차 타고 갔고.\n친구들 스토리 한번 봐. 비 온 날 얘기한 애 있던데?”':'“나 서윤이야. 그날 사실 우산 사러 혼자 가려던 참이었거든.\n네가 먼저 같이 가자고 해줘서 진짜 좋았어.\n오늘은 내가 챙길게. 친구사랑주간 행사 부스에서 만나!\n우리 다음에 비 오면 또 같이 가자.”'}</div><div class="callbottom"><div><button class="round red" aria-label="통화 종료" onclick="endCall()">☎</button><div class="calllabel">통화 종료하고 계속하기</div></div></div></div>`)}
function endCall(){if(callMode!=='active')return;S.calls[callType]=true;if(callType==='harin'&&S.stage===1)S.stage=2;if(callType==='seoyun'&&S.stage===3)S.stage=4;save();callMode='';if(callType==='harin'){navigate('instagram');notify('Instagram · dear_seohae','두 번째 힌트는 친구들 스토리에 있어 ☔','anon')}else{navigate('gift')}}
function gift(){const ok=S.stage===4;show(head('오늘의 선물')+`<div class="finish"><div style="font-size:75px;margin:20px 0">${ok?'🎁':'✉'}</div><h1>${ok?'고마움이 도착했어요':'아직 도착하지 않은 편지'}</h1><p>${ok?'“너는 별거 아니라고 생각했겠지만,<br>나한텐 고마운 일이었어.”<br>— 서윤':'연락과 기록을 따라<br>익명의 친구를 찾아보세요.'}</p>${ok?`<div class="ticket"><b>✓ 이야기 완료</b><p>서해고등학교 · 친구사랑주간<br>11월 11일</p><strong>이 화면을 담당 선생님께 보여주고<br>선물을 받아 가세요.</strong><p>1인 1회 수령 · 현장에서 확인</p></div>`:`<button class="primary" onclick="navigate('${S.stage===0?'anon':S.stage===1?'phone':S.stage===2?'instagram':'phone'}')">이야기 이어가기</button>`}<button class="reset" onclick="resetGame()">처음부터 다시 시작</button></div>`)}
function settings(){show(head('설정')+`<div class="pad settings"><h2>게임 설정</h2><label>알림·전화 효과음<input aria-label="효과음 켜기" type="checkbox" ${S.sound?'checked':''} onchange="S.sound=this.checked;save();tone()"></label><p class="muted">효과음 없이도 모든 이야기를 진행할 수 있어요. 실제 마이크나 전화 권한을 사용하지 않습니다.</p><h3>진행 도움말</h3><p class="muted">① 익명 DM 확인<br>② 우산 사진과 지난주 단톡방 읽기<br>③ DM에 답장하고 하린 전화 받기<br>④ 세 친구의 스토리 비교<br>⑤ 해당 친구의 스토리에 답장<br>⑥ 카톡에서 마지막 전화 받기</p><button class="choice" onclick="resetGame()">진행 기록 초기화</button><p class="muted">이 게임은 기기 내에만 진행 기록을 저장합니다. 실제 인스타·카카오톡 계정에 메시지를 보내지 않습니다.</p></div>`)}
function resetGame(){if(!confirm('이 게임의 진행 기록을 지우고 처음부터 시작할까요?'))return;hideToast();Object.assign(S,{unlocked:false,stage:0,seen:{},calls:{},likes:{},postLike:false,sound:false});pin='';err='';save();lock()}
document.addEventListener('keydown',e=>{if(page==='pin'){if(/^\d$/.test(e.key))digit(e.key);if(e.key==='Backspace'){pin=pin.slice(0,-1);pinScreen()}}});
if(S.unlocked)navigate('home');else lock();
</script></body></html>
